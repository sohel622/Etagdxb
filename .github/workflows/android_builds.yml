name: 🤖 Android Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Show Environment
        run: |
          echo "Java:"
          java -version

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "ANDROID_HOME=$ANDROID_HOME"
            find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses || true

          echo "Installing required Android SDK packages..."
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Node Dependencies
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            echo "package-lock.json found."
            npm ci --legacy-peer-deps

          elif [ -f bun.lock ] || [ -f bun.lockb ]; then
            echo "Bun lockfile found."
            echo "Installing dependencies with npm for GitHub Actions..."
            npm install --legacy-peer-deps

          else
            echo "No lockfile found."
            npm install --legacy-peer-deps
          fi

      - name: Install Capacitor
        shell: bash
        run: |
          set -e

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            --save

      - name: Build Vite Web App
        shell: bash
        run: |
          set -e

          echo "Building web application..."

          npm run build

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            echo "Files inside dist:"
            find dist -maxdepth 2 -type f -print || true
            exit 1
          fi

          echo "Web build successful."
          echo "dist contents:"
          find dist -maxdepth 2 -type f -print

      - name: Initialize Capacitor
        shell: bash
        run: |
          set -e

          if [ ! -f "capacitor.config.ts" ] && \
             [ ! -f "capacitor.config.js" ] && \
             [ ! -f "capacitor.config.json" ]; then

            echo "Creating Capacitor configuration..."

            npx cap init Flashgram com.flashgram.app \
              --web-dir dist
          else
            echo "Capacitor configuration already exists."
          fi

      - name: Ensure Capacitor Web Directory
        shell: bash
        run: |
          set -e

          if [ -f "capacitor.config.json" ]; then
            node <<'NODE'
          const fs = require("fs");

          const file = "capacitor.config.json";
          const config = JSON.parse(fs.readFileSync(file, "utf8"));

          config.webDir = "dist";

          fs.writeFileSync(
            file,
            JSON.stringify(config, null, 2) + "\n"
          );

          console.log("webDir set to dist.");
          NODE
          else
            echo "Using existing TypeScript/JavaScript Capacitor config."
          fi

      - name: Remove Old Android Project
        shell: bash
        run: |
          set -e

          echo "Removing old Android directory..."
          rm -rf android

      - name: Add Android Platform
        shell: bash
        run: |
          set -e

          npx cap add android

          if [ ! -d "android" ]; then
            echo "ERROR: Android platform was not created."
            exit 1
          fi

      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          npx cap sync android

      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew does not exist."
            exit 1
          fi

          if [ ! -d "android/app" ]; then
            echo "ERROR: android/app directory does not exist."
            exit 1
          fi

          chmod +x android/gradlew

          echo "Android project verified successfully."

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          echo "Starting Gradle build..."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not generated."

            echo "Available APK files:"
            find android -type f -name "*.apk" -print || true

            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Flashgram-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
