name: 🤖 Android Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17/x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Show Tool Versions
        run: |
          java -version
          node --version
          npm --version

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK command-line tools not found."
            echo "ANDROID_HOME=$ANDROID_HOME"
            find "${ANDROID_HOME}" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Node Dependencies
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            echo "package-lock.json detected."
            npm ci --legacy-peer-deps
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then
            echo "Bun lockfile detected."
            npm install --legacy-peer-deps
          else
            echo "No lockfile detected."
            npm install --legacy-peer-deps
          fi

      - name: Install Capacitor Dependencies
        shell: bash
        run: |
          set -e

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            --save

      - name: Build Vite Web Application
        shell: bash
        run: |
          set -e

          npm run build

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created by the web build."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not generated."
            echo "Contents of dist:"
            find dist -maxdepth 2 -type f -print || true
            exit 1
          fi

          echo "Web build completed successfully."
          du -sh dist

      - name: Configure Capacitor
        shell: bash
        run: |
          set -e

          if [ ! -f "capacitor.config.ts" ] && \
             [ ! -f "capacitor.config.js" ] && \
             [ ! -f "capacitor.config.json" ]; then

            echo "Creating Capacitor configuration..."

            npx cap init Flashgram com.flashgram.app \
              --web-dir dist \
              --npm-client npm
          else
            echo "Existing Capacitor configuration detected."
          fi

      - name: Configure Capacitor Web Directory
        shell: bash
        run: |
          set -e

          node <<'NODE'
          const fs = require("fs");

          const files = [
            "capacitor.config.ts",
            "capacitor.config.js",
            "capacitor.config.json"
          ];

          const existing = files.find(fs.existsSync);

          if (!existing) {
            throw new Error("No Capacitor configuration file found.");
          }

          console.log(`Using Capacitor configuration: ${existing}`);

          if (existing.endsWith(".json")) {
            const config = JSON.parse(fs.readFileSync(existing, "utf8"));
            config.webDir = "dist";
            fs.writeFileSync(
              existing,
              JSON.stringify(config, null, 2) + "\n"
            );
          }
          NODE

      - name: Remove Existing Android Platform
        shell: bash
        run: |
          set -e
          rm -rf android

      - name: Add Android Platform
        shell: bash
        run: |
          set -e

          npx cap add android

          if [ ! -d "android" ]; then
            echo "ERROR: Capacitor Android platform was not created."
            exit 1
          fi

      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          npx cap sync android

      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew was not generated."
            exit 1
          fi

          if [ ! -d "android/app" ]; then
            echo "ERROR: Android app module was not generated."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

      - name: Build Debug APK with Gradle
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find android/app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Flashgram-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
